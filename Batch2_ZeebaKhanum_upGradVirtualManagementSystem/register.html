<!DOCTYPE html>
<html>
<head>

<title>Event Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="js/script.js"></script>

</head>

<body>

<div class="container mt-5">

<h3>Event Registration</h3>

<div class="card p-3">

<h5>Event Details</h5>

<p>ID: 102</p>

<p>Name: MCT Summit</p>

<p>Category: Tech & Innovations</p>

<p>Date: 2026-03-09</p>

<p>Time: 14:15</p>

</div>

<form onsubmit="registerEvent(event)" class="mt-3">

<input type="text" placeholder="First Name" class="form-control mb-2" required>

<input type="text" placeholder="Last Name" class="form-control mb-2" required>

<input type="email" placeholder="Email" class="form-control mb-2" required>

<button class="btn btn-success">Register</button>

</form>

</div>

</body>
</html>
