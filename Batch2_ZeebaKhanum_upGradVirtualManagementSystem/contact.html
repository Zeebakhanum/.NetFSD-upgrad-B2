<!DOCTYPE html>
<html>
<head>

<title>Contact Us</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="js/script.js"></script>

</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card p-4" style="width: 400px;">

<h3 class="text-center mb-3">Contact Us</h3>

<form onsubmit="submitContact(event)">

<input type="text" placeholder="Name" class="form-control mb-3" required>

<input type="email" placeholder="Email" class="form-control mb-3" required>

<textarea placeholder="Description" class="form-control mb-3" required></textarea>

<button class="btn btn-primary w-100">Submit Query</button>

</form>

</div>

</body>
</html>
