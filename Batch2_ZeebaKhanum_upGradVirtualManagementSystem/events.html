<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Manage Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body onload="checkLogin(); displayEvents()">

<div class="container mt-4">

    <h3 class="text-center mb-3">Manage Events</h3>

    <div class="text-end mb-3">
        <button onclick="logout()" class="btn btn-danger">Logout</button>
    </div>

    <!--  Add Event Form -->
    <form onsubmit="addEvent(event)" class="mb-4">
        <input type="text" id="eventId" placeholder="Event ID" class="form-control mb-2" required>
        <input type="text" id="eventName" placeholder="Event Name" class="form-control mb-2" required>
        <select id="category" class="form-control mb-2" required>
            <option>Tech & Innovations</option>
            <option>Industrial Event</option>
        </select>
        <input type="date" id="date" class="form-control mb-2" required>
        <input type="time" id="time" class="form-control mb-2" required>
        <input type="url" id="url" placeholder="Event URL" class="form-control mb-2" required>
        <button class="btn btn-success w-100">Add Event</button>
    </form>

    <hr>

    <!--  Search Events -->
    <div class="mb-3">
        <input type="text" id="search" placeholder="Search event" class="form-control mb-2">
        <select id="filterCategory" class="form-control mb-2">
            <option value="">All Categories</option>
            <option>Tech & Innovations</option>
            <option>Industrial Event</option>
        </select>
        <button onclick="searchEvent()" class="btn btn-primary w-100">Search</button>
    </div>

    <!--  Register for Event Form -->
    <h4 class="mt-4 text-center">Participate in Event</h4>
    <form onsubmit="registerEvent(event)" class="mb-4">
        <input type="text" id="fname" placeholder="First Name" class="form-control mb-2" required>
        <input type="text" id="lname" placeholder="Last Name" class="form-control mb-2" required>
        <input type="email" id="emailUser" placeholder="Email" class="form-control mb-2" required>
        <button class="btn btn-success w-100">Register</button>
    </form>

    <!--  Event List -->
    <div class="row" id="eventList"></div>

</div>

<!--  Script at the end of body -->
<script src="js/script.js"></script>

</body>
</html>
