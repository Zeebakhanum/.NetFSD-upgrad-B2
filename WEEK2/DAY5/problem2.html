<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Market</title>

<!-- Bootstrap 5 CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand" href="#">Fresh Market 🥦</a>
  </div>
</nav>

<!-- Products Section -->
<div class="container py-5">
  <h2 class="text-center mb-4">Fresh Fruits & Vegetables</h2>

  <div class="row g-4">

    <!-- Product 1 -->
    <div class="col-12 col-md-6 col-lg-3">
      <div class="card h-100 shadow-sm">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Apples">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Fresh Apples 🍎</h5>
          <p class="card-text text-muted">Sweet and juicy farm fresh apples.</p>
          <h6 class="text-success mb-3">₹120 / kg</h6>
          <div class="mt-auto">
            <button class="btn btn-success w-100 mb-2">Add to Cart</button>
            <button class="btn btn-outline-success w-100">View Details</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Product 2 -->
    <div class="col-12 col-md-6 col-lg-3">
      <div class="card h-100 shadow-sm">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Bananas">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Bananas 🍌</h5>
          <p class="card-text text-muted">Rich in potassium and energy.</p>
          <h6 class="text-success mb-3">₹60 / dozen</h6>
          <div class="mt-auto">
            <button class="btn btn-success w-100 mb-2">Add to Cart</button>
            <button class="btn btn-outline-success w-100">View Details</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Product 3 -->
    <div class="col-12 col-md-6 col-lg-3">
      <div class="card h-100 shadow-sm">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Tomatoes">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Tomatoes 🍅</h5>
          <p class="card-text text-muted">Fresh organic red tomatoes.</p>
          <h6 class="text-success mb-3">₹40 / kg</h6>
          <div class="mt-auto">
            <button class="btn btn-success w-100 mb-2">Add to Cart</button>
            <button class="btn btn-outline-success w-100">View Details</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Product 4 -->
    <div class="col-12 col-md-6 col-lg-3">
      <div class="card h-100 shadow-sm">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Carrots">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Carrots 🥕</h5>
          <p class="card-text text-muted">Crunchy and healthy fresh carrots.</p>
          <h6 class="text-success mb-3">₹50 / kg</h6>
          <div class="mt-auto">
            <button class="btn btn-success w-100 mb-2">Add to Cart</button>
            <button class="btn btn-outline-success w-100">View Details</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
