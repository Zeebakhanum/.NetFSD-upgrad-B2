<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Landing Page</title>

<!-- Bootstrap 5 CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">ElectroStore</a>
  </div>
</nav>

<div class="container py-5">
  <h2 class="text-center mb-4">Latest Electronics</h2>

  <div class="row g-4">

    <!-- Product 1 -->
    <div class="col-12 col-md-6 col-lg-3">
      <div class="card h-100 shadow-sm">
        <img src="https://via.placeholder.com/300x200" class="card-img-top">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Bluetooth Speaker</h5>
          <p class="card-text text-muted">Portable speaker with deep bass sound.</p>
          <h6 class="text-primary mb-3">₹2,199</h6>
          <div class="mt-auto">
            <button class="btn btn-primary w-100 mb-2">Add to Cart</button>
            <button class="btn btn-outline-secondary w-100">View Details</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Product 2 -->
    <div class="col-12 col-md-6 col-lg-3">
      <div class="card h-100 shadow-sm">
        <img src="https://via.placeholder.com/300x200" class="card-img-top">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Wireless Mouse</h5>
          <p class="card-text text-muted">Ergonomic design with long battery life.</p>
          <h6 class="text-primary mb-3">₹799</h6>
          <div class="mt-auto">
            <button class="btn btn-primary w-100 mb-2">Add to Cart</button>
            <button class="btn btn-outline-secondary w-100">View Details</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Product 3 -->
    <div class="col-12 col-md-6 col-lg-3">
      <div class="card h-100 shadow-sm">
        <img src="https://via.placeholder.com/300x200" class="card-img-top">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">USB-C Charger</h5>
          <p class="card-text text-muted">Fast charging adapter for multiple devices.</p>
          <h6 class="text-primary mb-3">₹1,299</h6>
          <div class="mt-auto">
            <button class="btn btn-primary w-100 mb-2">Add to Cart</button>
            <button class="btn btn-outline-secondary w-100">View Details</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Product 4 -->
    <div class="col-12 col-md-6 col-lg-3">
      <div class="card h-100 shadow-sm">
        <img src="https://via.placeholder.com/300x200" class="card-img-top">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">External Hard Drive</h5>
          <p class="card-text text-muted">1TB portable storage solution.</p>
          <h6 class="text-primary mb-3">₹4,999</h6>
          <div class="mt-auto">
            <button class="btn btn-primary w-100 mb-2">Add to Cart</button>
            <button class="btn btn-outline-secondary w-100">View Details</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
