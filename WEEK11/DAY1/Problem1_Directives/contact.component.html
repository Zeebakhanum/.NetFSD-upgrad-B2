
<table *ngIf="contacts.length > 0; else noData">
  <tr *ngFor="let c of contacts"
      [ngClass]="c.isActive ? 'active-contact' : 'inactive-contact'"
      [ngStyle]="{color: c.isActive ? 'green' : 'red'}">
    <td>{{c.name}}</td>
    <td>{{c.email}}</td>
    <td>{{c.phone}}</td>
    <td *ngIf="c.isActive; else inactive">Active</td>
  </tr>
</table>

<ng-template #inactive>Inactive</ng-template>
<ng-template #noData>No Contacts Available</ng-template>
